version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: insight-spark-db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: insight_spark
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  server:
    build: ./server
    container_name: insight-spark-server
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: insight_spark
      CORS_ORIGIN: "*"
    depends_on:
      - mysql
    volumes:
      - server_uploads:/app/uploads

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api/client
    container_name: insight-spark-client
    ports:
      - "3000:80"

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api/admin
    container_name: insight-spark-admin
    ports:
      - "3001:80"

volumes:
  db_data:
  server_uploads:
